- name: Install Nginx on localhost
  hosts: localhost
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx
      package:
        name: nginx
        state: present
      become: yes

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
      become: yes